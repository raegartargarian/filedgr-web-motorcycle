<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dealership mark: the neon turntable ring from the hero footage, broken
       like a headlight arc, with the bike's contact point at its centre. -->
  <circle cx="32" cy="32" r="22" stroke="#7FD3E8" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="118 20" transform="rotate(-140 32 32)"/>
  <circle cx="32" cy="32" r="6" fill="#E8F0F8"/>
</svg>
